name: Mendix regression suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Validate generated tests for secrets
        run: npm run validate:generated

      - name: Run generated regression tests
        run: npm test
        env:
          # Point this at whatever environment should be tested on each push —
          # e.g. a Mendix Cloud test environment auto-deployed from this branch.
          BASE_URL: ${{ secrets.MENDIX_TEST_APP_URL }}
          MENDIX_TEST_USERNAME: ${{ secrets.MENDIX_TEST_USERNAME }}
          MENDIX_TEST_PASSWORD: ${{ secrets.MENDIX_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload validation output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-fail
          path: generated-tests/
          retention-days: 14

  enrich-dry-run:
    runs-on: ubuntu-latest
    if: ${{ secrets.GROQ_API_KEY != '' && secrets.MENDIX_TEST_APP_URL != '' }}
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dry-run enrich generated test
        run: |
          node explorer/enrich.js explorer/raw-sample.spec.js ${{ secrets.MENDIX_TEST_APP_URL }} generated-tests/dry-run.spec.js --dry-run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

